  const HOST = {badge:'https://raccoonclub.riseagencia.com/badge.png', icon:'https://raccoonclub.riseagencia.com/icon.png'};
  const $ = id => document.getElementById(id);
  const nome = () => ($('nome').value.trim() || 'Você');
  const primeiro = () => nome().split(' ')[0];
  const html = (h = false) => tpl
    .replaceAll(HOST.badge, h ? HOST.badge : IMG.badge).replaceAll(HOST.icon, h ? HOST.icon : IMG.icon)
    .replaceAll('?nome=[NOME]', '?nome=' + encodeURIComponent(nome()))
    .replaceAll('[NOME]', primeiro());
  const render = () => { $('prev').srcdoc = html(); };
  render();
  $('nome').addEventListener('input', render);
  const avisa = t => { $('ok').textContent = t; setTimeout(() => $('ok').textContent = '', 2500); };
  $('copiar').addEventListener('click', async () => {
    const h = html(true);
    const corpo = h.slice(h.indexOf('<body'), h.indexOf('</body>') + 7).replace(/<\/?body[^>]*>/g, '');
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([corpo], { type: 'text/html' }),
        'text/plain': new Blob([primeiro() + ', você foi convidado pro Raccoon Club: https://raccoonclub.riseagencia.com/?nome=' + encodeURIComponent(nome())], { type: 'text/plain' })
      })]);
      avisa('Copiado. Cola no corpo do e-mail.');
    } catch (e) { avisa('Não deu pra copiar. Usa Chrome ou Edge.'); }
  });
  $('assunto').addEventListener('click', async () => {
    await navigator.clipboard.writeText(primeiro() + ', você foi convidado pro Raccoon Club');
    avisa('Assunto copiado.');
  });
</script>
